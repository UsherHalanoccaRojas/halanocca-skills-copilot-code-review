<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mergington High School extracurricular activity registration and scheduling portal." />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://github.githubassets.com/favicons/favicon.svg"
    />
  </head>
  <body>
      <div class="announcement-banner">
          📢 Activity registration is open until the end of the month. Don't lose your spot!
      </div>
    <header role="banner">
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
      <div id="user-controls">
        <div id="user-status">
          <button id="login-button" class="icon-button">
            <span class="user-icon">👤</span>
            <span>Login</span>
          </button>
          <div id="user-info" class="hidden">
            <span id="display-name"></span>
            <button id="logout-button">Logout</button>
          </div>
        </div>
      </div>
    </header>

    <main role="main">
      <section id="activities-container">
        <div class="main-content-layout">
          <!-- Left Sidebar for Filters -->
          <aside class="sidebar-filters">
            <h3>Filter Activities</h3>
            <!-- Search Box -->
            <div class="search-box">
              <input type="text" id="activity-search" placeholder="Search activities..." />
              <button id="search-button" type="button" aria-label="Search">
                <span class="search-icon">🔍</span>
              </button>
            </div>

            <div class="filter-container">
              <div class="filter-label">Filter by category:</div>
              <div class="category-filters" id="category-filters">
                <button type="button" class="category-filter active" data-category="all" aria-pressed="true">All</button>
                <button type="button" class="category-filter" data-category="sports" aria-pressed="false">Sports</button>
                <button type="button" class="category-filter" data-category="arts" aria-pressed="false">Arts</button>
                <button type="button" class="category-filter" data-category="academic" aria-pressed="false">Academic</button>
                <button type="button" class="category-filter" data-category="community" aria-pressed="false">Community</button>
                <button type="button" class="category-filter" data-category="technology" aria-pressed="false">Technology</button>
              </div>
            </div>

            <!-- Day Filter -->
            <div class="filter-container day-filter-container">
              <div class="filter-label">Filter by day:</div>
              <div class="day-filters" id="day-filters">
                <button type="button" class="day-filter active" data-day="" aria-pressed="true">All Days</button>
                <button type="button" class="day-filter" data-day="Monday" aria-pressed="false">Monday</button>
                <button type="button" class="day-filter" data-day="Tuesday" aria-pressed="false">Tuesday</button>
                <button type="button" class="day-filter" data-day="Wednesday" aria-pressed="false">Wednesday</button>
                <button type="button" class="day-filter" data-day="Thursday" aria-pressed="false">Thursday</button>
                <button type="button" class="day-filter" data-day="Friday" aria-pressed="false">Friday</button>
                <button type="button" class="day-filter" data-day="Saturday" aria-pressed="false">Saturday</button>
                <button type="button" class="day-filter" data-day="Sunday" aria-pressed="false">Sunday</button>
              </div>
            </div>

            <!-- Time Filter -->
            <div class="filter-container time-filter-container">
              <div class="filter-label">Filter by time:</div>
              <div class="time-filters">
                <button type="button" class="time-filter active" data-time="" aria-pressed="true">All Times</button>
                <button type="button" class="time-filter" data-time="morning" aria-pressed="false">Before School</button>
                <button type="button" class="time-filter" data-time="afternoon" aria-pressed="false">After School</button>
                <button type="button" class="time-filter" data-time="weekend" aria-pressed="false">Weekend</button>
              </div>
            </div>
          </aside>

          <!-- Activities Content -->
          <div class="activities-content">
            <div id="activities-list">
              <!-- Activities will be loaded here -->
              <p>Loading activities...</p>
            </div>
            <div id="message" class="hidden message"></div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <!-- Registration Modal -->
    <div id="registration-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="registration-title">
      <div class="modal-content">
        <span class="close-modal" aria-label="Close registration modal">&times;</span>
        <h3 id="registration-title">Register for <span id="modal-activity-name"></span></h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <input type="hidden" id="activity" value="" />
          <button type="submit">Register</button>
        </form>
      </div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="login-title">
      <div class="modal-content">
        <span class="close-login-modal" aria-label="Close login modal">&times;</span>
        <h3 id="login-title">Teacher Login</h3>
        <form id="login-form">
          <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" required placeholder="Enter your username" />
          </div>
          <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" required placeholder="Enter your password" />
          </div>
          <button type="submit">Login</button>
        </form>
        <div id="login-message" class="hidden message"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
  <!-- update for review -->
</html>
